<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#111827"/>
  <rect width="400" height="400" fill="url(#grid)" opacity="0.3"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e2d4a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#glow)"/>
  <!-- Simulated photon noise dots -->
  <g fill="#00d4ff" opacity="0.6">
    <circle cx="43" cy="87" r="1.5"/><circle cx="127" cy="34" r="1"/><circle cx="251" cy="61" r="1.5"/>
    <circle cx="318" cy="142" r="1"/><circle cx="78" cy="193" r="2"/><circle cx="167" cy="220" r="1.5"/>
    <circle cx="343" cy="275" r="1"/><circle cx="94" cy="312" r="1.5"/><circle cx="209" cy="358" r="1"/>
    <circle cx="371" cy="88" r="1.5"/><circle cx="155" cy="145" r="1"/><circle cx="284" cy="197" r="2"/>
    <circle cx="61" cy="251" r="1"/><circle cx="334" cy="333" r="1.5"/><circle cx="183" cy="299" r="1"/>
  </g>
  <!-- Center placeholder icon -->
  <text x="200" y="185" text-anchor="middle" font-family="system-ui" font-size="52" fill="#1e2d4a">🖼</text>
  <text x="200" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">Placeholder</text>
  <text x="200" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Replace with actual reconstruction</text>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">assets/results/&lt;arch&gt;.png</text>
</svg>
